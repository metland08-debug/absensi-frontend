<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Absensi Linmas</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f172a">

<style>

body{
font-family:Arial, sans-serif;
margin:0;
padding:20px;
display:flex;
justify-content:center;
background:
linear-gradient(160deg,#0f172a,#1e3a8a,#2563eb);
min-height:100vh;
}

.container{

background:white;
width:100%;
max-width:420px;
padding:24px;
border-radius:18px;

box-shadow:
0 20px 40px rgba(0,0,0,0.35);

}

.logo{
width:150px;
display:block;
margin:auto;
margin-bottom:10px;
}

h2{
text-align:center;
color:#1e3a8a;
margin:8px 0 18px;
font-size:24px;
}

.infoBox{

background:#f1f5f9;
padding:12px;
border-radius:10px;
margin-bottom:18px;
font-size:14px;

}

.jadwalBox{

background:#fef3c7;
padding:12px;
border-radius:10px;
margin-bottom:18px;
font-weight:bold;
color:#92400e;

}

label{

font-weight:bold;
font-size:14px;
color:#334155;

}

select{

width:100%;
padding:12px;
font-size:16px;
border-radius:10px;
border:1px solid #cbd5e1;

margin-top:6px;
margin-bottom:18px;

}

.statusGrid{

display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-bottom:18px;

}

.statusBtn{

padding:14px;
border-radius:10px;
border:none;
font-weight:bold;
font-size:14px;
cursor:pointer;
transition:0.15s;

}

.statusBtn:hover{

transform:scale(1.02);

}

.datang{

background:#16a34a;
color:white;

}

.pulang{

background:#2563eb;
color:white;

}

.sakit{

background:#f59e0b;
color:white;

}

.izin{

background:#64748b;
color:white;

}

.statusBtn.active{

box-shadow:
0 0 0 3px rgba(0,0,0,0.15);

}

.submitBtn{

width:100%;
padding:15px;

font-size:16px;
border:none;
border-radius:12px;

background:linear-gradient(135deg,#2563eb,#1d4ed8);

color:white;
font-weight:bold;
cursor:pointer;

}

.submitBtn:disabled{

opacity:0.6;

}

#message{

text-align:center;
margin-top:12px;
font-weight:bold;
font-size:14px;

}

.footer{

text-align:center;
font-size:12px;
color:#64748b;
margin-top:18px;

}

</style>

</head>

<body>

<div class="container">

<img src="LOGO RT8&9.png" class="logo">

<h2>Absensi Linmas</h2>

<div class="infoBox">
📅 <span id="tanggal"></span>
</div>

<label>Nama Petugas</label>

<select id="nama"></select>

<div class="jadwalBox">
Jadwal Anda Hari Ini : <b id="jadwalPetugas">-</b>
</div>

<label>Pilih Absen</label>

<div class="statusGrid">

<button class="statusBtn datang"
onclick="pilihStatus('MASUK')" id="btnMasuk">
DATANG
</button>

<button class="statusBtn pulang"
onclick="pilihStatus('PULANG')" id="btnPulang">
PULANG
</button>

<button class="statusBtn sakit"
onclick="pilihStatus('SAKIT')" id="btnSakit">
SAKIT
</button>

<button class="statusBtn izin"
onclick="pilihStatus('IZIN')" id="btnIzin">
IZIN
</button>

</div>

<button class="submitBtn"
id="btnSubmit"
onclick="submitAbsen()">
Kirim Absensi
</button>

<div id="message"></div>

<div class="footer">
RT 08 & 09 Perumahan Metland Puri © 2026
</div>

</div>

<script>

const BASE_URL="https://absensi-backend-sc11.onrender.com";

const SIKLUS=["Pagi 1","Pagi 2","Malam 1","Malam 2","Libur"];

const START_DATE=new Date("2026-01-26");

let petugasList=[];

let statusDipilih="MASUK";

function pilihStatus(status){

statusDipilih=status;

document.querySelectorAll(".statusBtn")
.forEach(b=>b.classList.remove("active"));

if(status==="MASUK")document.getElementById("btnMasuk").classList.add("active");
if(status==="PULANG")document.getElementById("btnPulang").classList.add("active");
if(status==="SAKIT")document.getElementById("btnSakit").classList.add("active");
if(status==="IZIN")document.getElementById("btnIzin").classList.add("active");

}

function getGlobalIndex(){

const now=new Date();

const diff=Math.floor((now-START_DATE)/(1000*60*60*24));

return diff%5;

}

function getJadwalPetugas(offset){

const global=getGlobalIndex();

return SIKLUS[(global+offset)%5];

}

async function loadPetugas(){

try{

const res=await fetch(BASE_URL+"/petugas");

const data=await res.json();

petugasList=data;

const select=document.getElementById("nama");

select.innerHTML='<option value="">-- Pilih Nama --</option>';

data.forEach(p=>{

const option=document.createElement("option");

option.value=p.id;

option.textContent=p.nama;

select.appendChild(option);

});

}catch(e){

document.getElementById("message").innerText="Gagal memuat petugas";

}

}

document.getElementById("nama").addEventListener("change",function(){

const id=this.value;

const petugas=petugasList.find(p=>p.id==id);

if(!petugas){

document.getElementById("jadwalPetugas").innerText="-";

return;

}

if(petugas.is_backup){

document.getElementById("jadwalPetugas").innerText="Backup";

}else{

document.getElementById("jadwalPetugas").innerText=
getJadwalPetugas(petugas.siklus_offset);

}

});

async function submitAbsen(){

const btn=document.getElementById("btnSubmit");

btn.disabled=true;

const petugas_id=document.getElementById("nama").value;

const status=statusDipilih;

document.getElementById("message").innerText="Mengirim absensi...";

if(!petugas_id){

document.getElementById("message").innerText="Pilih nama dulu";

btn.disabled=false;

return;

}

try{

const controller=new AbortController();

const timeout=setTimeout(()=>controller.abort(),8000);

const res=await fetch(BASE_URL+"/absensi",{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

petugas_id:petugas_id,

status:status

}),

signal:controller.signal

});

clearTimeout(timeout);

const result=await res.json();

if(res.ok){

document.getElementById("message").innerText="Absen berhasil";

document.getElementById("nama").value="";

document.getElementById("jadwalPetugas").innerText="-";

}else{

document.getElementById("message").innerText=result.error||"Gagal absen";

}

}catch(e){

document.getElementById("message").innerText="Server tidak bisa dihubungi";

}

btn.disabled=false;

}

function setTanggal(){

const now=new Date();

document.getElementById("tanggal").innerText=

now.toLocaleDateString("id-ID",{

weekday:"long",

day:"numeric",

month:"long",

year:"numeric"

});

}

setTanggal();

loadPetugas();

pilihStatus("MASUK");

</script>

</body>
</html>
