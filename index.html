<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Absensi Linmas</title>
</head>
<body>

  <h1>Absensi Linmas</h1>

  <h2>Daftar Petugas</h2>
  <ul id="list-petugas"></ul>

  <h2>Tambah Petugas</h2>
  <input type="text" id="nama" placeholder="Nama">
  <input type="text" id="no_hp" placeholder="No HP">
  <button onclick="tambahPetugas()">Tambah</button>

  <script>
    const API = "https://absensi-backend-sc11.onrender.com";

    async function loadPetugas() {
      const res = await fetch(API + "/petugas");
      const data = await res.json();

      const list = document.getElementById("list-petugas");
      list.innerHTML = "";

      data.forEach(p => {
        const li = document.createElement("li");
        li.textContent = p.nama + (p.aktif ? " ✅" : " ❌");
        list.appendChild(li);
      });
    }

    async function tambahPetugas() {
      const nama = document.getElementById("nama").value;
      const no_hp = document.getElementById("no_hp").value;

      await fetch(API + "/petugas", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ nama, no_hp })
      });

      document.getElementById("nama").value = "";
      document.getElementById("no_hp").value = "";

      loadPetugas();
    }

    loadPetugas();
  </script>

</body>
</html>
