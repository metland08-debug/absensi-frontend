<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Absensi Linmas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      padding: 20px;
    }
.jadwal-box {
  background: #f0f4ff;
  padding: 12px;
  border-radius: 10px;
  margin-bottom: 15px;
  font-size: 14px;
  border-left: 5px solid #2a5298;
}
    .container {
      background: white;
      color: #333;
      width: 100%;
      max-width: 450px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .logo {
      width: 100px;
      display: block;
      margin: 0 auto 15px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
      color: #2a5298;
    }

    select, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #2a5298;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #1e3c72;
    }

    .status-box {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      display: none;
    }

    .success {
      background: #d4edda;
      color: #155724;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
    }

    .riwayat-item {
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 14px;
    }

    .masuk {
      background: #d4edda;
      color: #155724;
    }

    .pulang {
      background: #f8d7da;
      color: #721c24;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: gray;
    }
  </style>
</head>

<body>
  <div class="container">

    <img src="LOGO%20RT8%269.png" class="logo">

    <h1>Absensi Linmas</h1>
<div id="jadwal-hari-ini" class="jadwal-box"></div>    
    <label>Nama Petugas</label>
    <select id="petugas"></select>

    <label>Status</label>
    <select id="status">
      <option value="MASUK">MASUK</option>
      <option value="PULANG">PULANG</option>
    </select>

    <button onclick="tambahAbsensi()">Kirim Absensi</button>

    <div id="message" class="status-box"></div>

    <hr style="margin:20px 0">

    <h3>Riwayat Absensi</h3>
    <div id="riwayat"></div>

    <div class="footer">
      RT 08 & 09 Perumahan Metland Puri © 2026
    </div>

  </div>

<script>
const API = "https://absensi-backend-sc11.onrender.com";

async function loadPetugas() {
  const res = await fetch(API + "/petugas");
  const data = await res.json();

  const select = document.getElementById("petugas");
  select.innerHTML = "";

  data.forEach(p => {
    const option = document.createElement("option");
    option.value = p.id;
    option.textContent = p.nama;
    select.appendChild(option);
  });
}

async function loadRiwayat() {
  const res = await fetch(API + "/absensi");
  const data = await res.json();

  const riwayat = document.getElementById("riwayat");
  riwayat.innerHTML = "";

  data.forEach(item => {
    const div = document.createElement("div");
    div.classList.add("riwayat-item");

    if (item.status === "MASUK") {
      div.classList.add("masuk");
    } else {
      div.classList.add("pulang");
    }

    div.textContent =
      item.nama + " - " +
      item.tanggal.split("T")[0] + " " +
      item.jam + " - " +
      item.status;

    riwayat.appendChild(div);
  });
}

async function tambahAbsensi() {
  const petugas_id = document.getElementById("petugas").value;
  const status = document.getElementById("status").value;
  const message = document.getElementById("message");

  const now = new Date();
  const tanggal = now.toISOString().split("T")[0];
  const jam = now.toTimeString().split(" ")[0];

  const res = await fetch(API + "/absensi", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ petugas_id, tanggal, jam, status })
  });

  const data = await res.json();

  message.style.display = "block";

  if (res.ok) {
    message.className = "status-box success";
    message.textContent = "Absensi berhasil!";
    loadRiwayat(); // dipanggil setelah sukses
  } else {
    message.className = "status-box error";
    message.textContent = data.error || "Terjadi kesalahan";
  }
}
function tampilkanJadwal() {
  const startDate = new Date("2026-01-26");
  const now = new Date();

  const today = new Date(now);
  today.setHours(0,0,0,0);

  const diffTime = today.getTime() - startDate.getTime();
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  const index = ((diffDays % 5) + 5) % 5;

  const shiftList = [
    "🟢 Pagi 1",
    "🟢 Pagi 2",
    "🌙 Malam 1",
    "🌙 Malam 2",
    "⚪ Libur"
  ];

  const shift = shiftList[index];
  const jadwalBox = document.getElementById("jadwal-hari-ini");
  const tombol = document.querySelector("button");

  const hari = now.toLocaleDateString("id-ID", {
    weekday: "long",
    year: "numeric",
    month: "long",
    day: "numeric"
  });

  jadwalBox.innerHTML =
    "📅 " + hari + "<br>" +
    "🔄 Siklus ke: " + index + "<br>" +
    "📌 Jadwal Hari Ini: <b>" + shift + "</b>";

  // Jika LIBUR
  if (index === 4) {
    tombol.disabled = true;
    tombol.style.background = "#999";
    jadwalBox.style.borderLeft = "5px solid gray";
    jadwalBox.innerHTML += "<br><br>⚠ Hari ini LIBUR, tidak perlu absen.";
  } else {
    tombol.disabled = false;
    tombol.style.background = "#2a5298";
    jadwalBox.style.borderLeft = "5px solid #2a5298";
  }
}
loadPetugas();
loadRiwayat();
  tampilkanJadwal();
setInterval(tampilkanJadwal, 1000);
</script>

</body>
</html>
