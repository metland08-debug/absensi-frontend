<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Absensi Linmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  padding:15px;
}
.container{
  background:white;
  width:100%;
  max-width:450px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
.logo{
  width:90px;
  display:block;
  margin:0 auto 15px auto;
}
h1{
  text-align:center;
  color:#2a5298;
  font-size:20px;
}
.jadwal-box{
  background:#f0f4ff;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
  font-size:14px;
  border-left:4px solid #2a5298;
}
.jadwal-petugas-box{
  background:#fff8e1;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
  border-left:4px solid #ff9800;
}
select,button{
  width:100%;
  padding:16px;
  margin-top:10px;
  border-radius:8px;
  border:1px solid #ccc;
  font-size:16px;
}
button{
  background:#2a5298;
  color:white;
  border:none;
  font-weight:bold;
}
button:disabled{
  background:#999;
}
.status-box{
  margin-top:12px;
  padding:10px;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  display:none;
}
.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
.riwayat-item{
  padding:6px;
  margin-bottom:6px;
  border-radius:6px;
  font-size:13px;
}
.masuk{background:#d4edda;color:#155724;}
.pulang{background:#f8d7da;color:#721c24;}
.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:gray;
}
</style>
</head>

<body>
<div class="container">

<img src="LOGO%20RT8%269.png" class="logo">

<h1>Absensi Linmas</h1>

<div id="jadwal-hari-ini" class="jadwal-box"></div>

<select id="petugas">
<option value="">-- Pilih Nama --</option>
</select>

<div id="jadwal-petugas" class="jadwal-petugas-box"></div>

<select id="status">
<option value="MASUK">MASUK</option>
<option value="PULANG">PULANG</option>
</select>

<button id="btnAbsen" onclick="tambahAbsensi()">Kirim Absensi</button>

<div id="message" class="status-box"></div>

<hr style="margin:15px 0">

<h3 style="font-size:16px;">Riwayat Terakhir</h3>
<div id="riwayat"></div>

<div class="footer">
RT 08 & 09 Perumahan Metland Puri © 2026
</div>

</div>

<script>

const API="https://absensi-backend-sc11.onrender.com";
const TARGET_LAT=-6.195772;
const TARGET_LNG=106.709001;
const RADIUS_METERS=50;

/* ================= LOAD PETUGAS ================= */
async function loadPetugas(){
  const res=await fetch(API+"/petugas");
  const data=await res.json();

  const select=document.getElementById("petugas");
  select.innerHTML='<option value="">-- Pilih Nama --</option>';

  data.forEach(p=>{
    const option=document.createElement("option");
    option.value=p.id;
    option.textContent=p.nama;
    option.dataset.offset=p.siklus_offset ?? 0;
    option.dataset.backup=p.is_backup ? "true" : "false";
    select.appendChild(option);
  });
}

/* ================= SIKLUS GLOBAL ================= */
function getGlobalIndex(){
  const startDate=new Date("2026-01-26");
  const today=new Date();
  today.setHours(0,0,0,0);
  const diffDays=Math.floor((today-startDate)/(1000*60*60*24));
  return ((diffDays%5)+5)%5;
}

function tampilkanJadwal(){
  const index=getGlobalIndex();
  const shiftList=["🟢 Pagi 1","🟢 Pagi 2","🌙 Malam 1","🌙 Malam 2","⚪ Libur"];

  document.getElementById("jadwal-hari-ini").innerHTML=
  "📅 "+new Date().toLocaleDateString("id-ID")+
  "<br>📌 Jadwal Global: <b>"+shiftList[index]+"</b>";
}

/* ================= JADWAL PETUGAS ================= */
function updateJadwalPetugas(){
  const select=document.getElementById("petugas");
  if(!select.value) return;

  const selected=select.options[select.selectedIndex];
  const offset=parseInt(selected.dataset.offset||0);
  const isBackup=selected.dataset.backup==="true";

  const box=document.getElementById("jadwal-petugas");
  const tombol=document.getElementById("btnAbsen");

  if(isBackup){
    box.innerHTML="Status: 🟣 BACKUP (Siap menggantikan)";
    box.style.borderLeft="4px solid purple";
    tombol.disabled=false;
    tombol.style.background="#6a1b9a";
    return;
  }

  const globalIndex=getGlobalIndex();
  const petugasIndex=(globalIndex+offset)%5;

  const shiftList=["🟢 Pagi 1","🟢 Pagi 2","🌙 Malam 1","🌙 Malam 2","⚪ LIBUR"];
  const shift=shiftList[petugasIndex];

  box.innerHTML="Jadwal Anda Hari Ini: "+shift;

  if(petugasIndex===4){
    tombol.disabled=true;
    tombol.style.background="#999";
  }else{
    tombol.disabled=false;
    tombol.style.background="#2a5298";
  }
}

/* ================= HITUNG JARAK ================= */
function hitungJarak(lat1, lon1, lat2, lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=
    Math.sin(dLat/2)*Math.sin(dLat/2)+
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/* ================= ABSENSI ================= */
async function tambahAbsensi(){

  const tombol=document.getElementById("btnAbsen");
  const petugas_id=document.getElementById("petugas").value;
  const status=document.getElementById("status").value;
  const message=document.getElementById("message");

  if(!petugas_id){
    alert("Pilih nama terlebih dahulu");
    return;
  }

  message.style.display="block";
  message.className="status-box";
  message.textContent="Validasi lokasi...";

  navigator.geolocation.getCurrentPosition(async pos=>{

    if(pos.coords.accuracy>30){
      message.className="status-box error";
      message.textContent="GPS tidak presisi.";
      return;
    }

    const jarak=hitungJarak(
      pos.coords.latitude,
      pos.coords.longitude,
      TARGET_LAT,
      TARGET_LNG
    );

    if(jarak>RADIUS_METERS){
      message.className="status-box error";
      message.textContent="Anda di luar area POS 9!";
      return;
    }

    tombol.disabled=true;
    tombol.innerText="Mengirim...";

    const res=await fetch(API+"/absensi",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({petugas_id,status})
    });

    const data=await res.json();

    if(res.ok){
      message.className="status-box success";
      message.textContent="Absensi berhasil!";
      loadRiwayat();
    }else{
      message.className="status-box error";
      message.textContent=data.error||"Terjadi kesalahan";
    }

    tombol.disabled=false;
    tombol.innerText="Kirim Absensi";

  },()=>{
    message.className="status-box error";
    message.textContent="GPS harus aktif!";
  });
}

/* ================= RIWAYAT ================= */
async function loadRiwayat(){
  const res=await fetch(API+"/absensi");
  const data=await res.json();

  const riwayat=document.getElementById("riwayat");
  riwayat.innerHTML="";

  data.slice(0,20).forEach(item=>{
    const div=document.createElement("div");
    div.classList.add("riwayat-item");
    div.classList.add(item.status==="MASUK"?"masuk":"pulang");
    div.textContent=
      item.nama+" - "+
      item.tanggal.split("T")[0]+" "+
      item.jam+" - "+
      item.status;
    riwayat.appendChild(div);
  });
}

/* ================= INIT ================= */
document.getElementById("petugas").addEventListener("change",updateJadwalPetugas);
loadPetugas();
loadRiwayat();
tampilkanJadwal();

</script>

</body>
</html>
