<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Absensi Linmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  padding:15px;
}
.container{
  background:white;
  width:100%;
  max-width:450px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}
.logo{
  width:90px;
  display:block;
  margin:0 auto 15px auto;
}
h1{
  text-align:center;
  color:#2a5298;
  font-size:20px;
}
.tanggal-box{
  background:#f0f4ff;
  padding:10px;
  border-radius:8px;
  margin-bottom:10px;
  font-size:15px;
  text-align:center;
  font-weight:bold;
  border-left:4px solid #2a5298;
}
.jadwal-petugas-box{
  background:#fff8e1;
  padding:10px;
  border-radius:8px;
  margin-top:10px;
  font-weight:bold;
  border-left:4px solid #ff9800;
}
.button-group{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
button{
  flex:1 1 48%;
  padding:14px;
  border-radius:8px;
  border:none;
  font-size:14px;
  font-weight:bold;
  color:white;
}
#btnMasuk{ background:#2e7d32; }
#btnPulang{ background:#c62828; }
#btnIjin{ background:#f9a825; }
#btnSakit{ background:#6a1b9a; }

video{
  width:100%;
  margin-top:10px;
  border-radius:10px;
  display:none;
}

.status-box{
  margin-top:12px;
  padding:10px;
  text-align:center;
  border-radius:8px;
  font-weight:bold;
  display:none;
}
.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}

.footer{
  text-align:center;
  margin-top:15px;
  font-size:12px;
  color:gray;
}
</style>
</head>

<body>
<div class="container">

<img src="LOGO%20RT8%269.png" class="logo">
<h1>Absensi Linmas</h1>

<div id="tanggal" class="tanggal-box"></div>

<select id="petugas">
<option value="">-- Pilih Nama --</option>
</select>

<div id="jadwal-petugas" class="jadwal-petugas-box"></div>

<div id="tombol-absen" class="button-group" style="display:none;">
  <button id="btnMasuk" onclick="prosesAbsensi('MASUK')">MASUK</button>
  <button id="btnPulang" onclick="prosesAbsensi('PULANG')">PULANG</button>
  <button id="btnIjin" onclick="prosesAbsensi('IJIN')">IJIN</button>
  <button id="btnSakit" onclick="prosesAbsensi('SAKIT')">SAKIT</button>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<div id="message" class="status-box"></div>

<div class="footer">
RT 08 & 09 Perumahan Metland Puri © 2026
</div>

</div>

<script>

const API="https://absensi-backend-sc11.onrender.com";
const TARGET_LAT=-6.195772;
const TARGET_LNG=106.709001;
const RADIUS_METERS=50;

/* ================= TANGGAL ================= */
function tampilkanTanggal(){
  const now=new Date(
    new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
  );
  const formatted=now.toLocaleDateString("id-ID",{
    weekday:"long",
    day:"2-digit",
    month:"long",
    year:"numeric"
  });
  document.getElementById("tanggal").innerText=formatted;
}

/* ================= LOAD PETUGAS ================= */
async function loadPetugas(){
  const res=await fetch(API+"/petugas");
  const data=await res.json();
  const select=document.getElementById("petugas");
  select.innerHTML='<option value="">-- Pilih Nama --</option>';
  data.forEach(p=>{
    const option=document.createElement("option");
    option.value=p.id;
    option.textContent=p.nama;
    option.dataset.offset=p.siklus_offset ?? 0;
    option.dataset.backup=p.is_backup ? "true":"false";
    select.appendChild(option);
  });
}

/* ================= SIKLUS ================= */
function getGlobalIndex(){
  const startDate=new Date("2026-01-26T00:00:00+07:00");
  const today=new Date(
    new Date().toLocaleString("en-US",{timeZone:"Asia/Jakarta"})
  );
  today.setHours(0,0,0,0);
  const diffDays=Math.floor((today-startDate)/(1000*60*60*24));
  return ((diffDays%5)+5)%5;
}

function updateJadwalPetugas(){
  const select=document.getElementById("petugas");
  const box=document.getElementById("jadwal-petugas");
  const tombol=document.getElementById("tombol-absen");

  if(!select.value){
    box.innerHTML="";
    tombol.style.display="none";
    return;
  }

  const selected=select.options[select.selectedIndex];
  const offset=parseInt(selected.dataset.offset||0);
  const isBackup=selected.dataset.backup==="true";

  if(isBackup){
    box.innerHTML="Status: 🟣 BACKUP (Siap menggantikan)";
    tombol.style.display="flex";
    return;
  }

  const globalIndex=getGlobalIndex();
  const petugasIndex=(globalIndex+offset)%5;
  const shiftList=["🟢 Pagi 1","🟢 Pagi 2","🌙 Malam 1","🌙 Malam 2","⚪ LIBUR"];
  const shift=shiftList[petugasIndex];

  box.innerHTML="Jadwal Anda Hari Ini: "+shift;

  if(petugasIndex===4){
    tombol.style.display="none";
  }else{
    tombol.style.display="flex";
  }
}

/* ================= CAMERA ================= */
async function ambilFoto(){
  const video=document.getElementById("video");
  video.style.display="block";

  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  video.srcObject=stream;

  await new Promise(resolve=>setTimeout(resolve,1500));

  const canvas=document.getElementById("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);

  stream.getTracks().forEach(track=>track.stop());
  video.style.display="none";

  return new Promise(resolve=>{
    canvas.toBlob(blob=>{
      resolve(blob);
    },"image/jpeg",0.9);
  });
}

/* ================= ABSENSI ================= */
async function prosesAbsensi(status){

  const petugas_id=document.getElementById("petugas").value;
  const message=document.getElementById("message");

  message.style.display="block";
  message.className="status-box";
  message.textContent="Mengambil lokasi...";

  navigator.geolocation.getCurrentPosition(async pos=>{

    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;
    const accuracy=pos.coords.accuracy;

    if(accuracy>40){
      message.className="status-box error";
      message.textContent="GPS tidak presisi.";
      return;
    }

    if(status==="MASUK"||status==="PULANG"){
      const jarak=hitungJarak(lat,lng,TARGET_LAT,TARGET_LNG);
      if(jarak>RADIUS_METERS){
        message.className="status-box error";
        message.textContent="Anda di luar area POS 9!";
        return;
      }
    }

    message.textContent="Mengambil foto selfie...";
    const foto=await ambilFoto();

    const formData=new FormData();
    formData.append("petugas_id",petugas_id);
    formData.append("status",status);
    formData.append("latitude",lat);
    formData.append("longitude",lng);
    formData.append("accuracy",accuracy);
    formData.append("foto",foto);

    message.textContent="Mengirim data...";

    const res=await fetch(API+"/absensi",{
      method:"POST",
      body:formData
    });

    const data=await res.json();

    if(res.ok){
      message.className="status-box success";
      message.textContent="Absensi berhasil!";
    }else{
      message.className="status-box error";
      message.textContent=data.error||"Gagal absen.";
    }

  },()=>{
    message.className="status-box error";
    message.textContent="GPS harus aktif!";
  });
}

function hitungJarak(lat1, lon1, lat2, lon2){
  const R=6371000;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)*Math.sin(dLat/2)+
          Math.cos(lat1*Math.PI/180)*
          Math.cos(lat2*Math.PI/180)*
          Math.sin(dLon/2)*Math.sin(dLon/2);
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

document.getElementById("petugas").addEventListener("change",updateJadwalPetugas);
loadPetugas();
tampilkanTanggal();

</script>
</body>
</html>
