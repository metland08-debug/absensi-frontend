<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Absensi Linmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  display:flex;
  justify-content:center;
  padding:15px;
}

.container{
  background:white;
  width:100%;
  max-width:450px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

h1{
  text-align:center;
  color:#2a5298;
  font-size:20px;
}

.tanggal-box{
  background:#f0f4ff;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-bottom:10px;
}

select,button{
  width:100%;
  padding:15px;
  margin-top:10px;
  border-radius:8px;
  font-size:16px;
}

button{
  color:white;
  border:none;
  font-weight:bold;
}

#btnMasuk{background:#2e7d32;}
#btnPulang{background:#c62828;}

video{
  width:100%;
  margin-top:10px;
  border-radius:10px;
}

canvas{
  display:none;
}

.status-box{
  margin-top:10px;
  padding:10px;
  border-radius:8px;
  display:none;
  text-align:center;
  font-weight:bold;
}

.success{background:#d4edda;color:#155724;}
.error{background:#f8d7da;color:#721c24;}
</style>
</head>

<body>
<div class="container">

<h1>Absensi Linmas</h1>

<div id="tanggal" class="tanggal-box"></div>

<select id="petugas"></select>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>

<div style="display:flex; gap:10px;">
  <button id="btnMasuk" onclick="prosesAbsensi('MASUK')">MASUK</button>
  <button id="btnPulang" onclick="prosesAbsensi('PULANG')">PULANG</button>
</div>

<div id="message" class="status-box"></div>

</div>

<script>
const API="https://absensi-backend-sc11.onrender.com";

/* ================= POS 9 COORD ================= */
const TARGET_LAT = -6.195772;
const TARGET_LNG = 106.709001;
const RADIUS_METERS = 50;

/* ================= TANGGAL ================= */
function tampilkanTanggal(){
  const now=new Date();
  const hari=now.toLocaleDateString("id-ID",{weekday:"long"});
  const tanggal=now.toLocaleDateString("id-ID",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("tanggal").innerText=
    hari.charAt(0).toUpperCase()+hari.slice(1)+", "+tanggal;
}

/* ================= LOAD PETUGAS ================= */
async function loadPetugas(){
  const res=await fetch(API+"/petugas");
  const data=await res.json();
  const select=document.getElementById("petugas");
  select.innerHTML="";
  data.forEach(p=>{
    const option=document.createElement("option");
    option.value=p.id;
    option.textContent=p.nama;
    select.appendChild(option);
  });
}

/* ================= GEO DISTANCE ================= */
function hitungJarak(lat1, lon1, lat2, lon2){
  const R = 6371000;
  const dLat = (lat2-lat1) * Math.PI/180;
  const dLon = (lon2-lon1) * Math.PI/180;
  const a =
    Math.sin(dLat/2)*Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)*Math.sin(dLon/2);
  const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/* ================= AKTIFKAN CAMERA ================= */
async function startCamera(){
  const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  document.getElementById("video").srcObject=stream;
}

/* ================= CAPTURE FOTO ================= */
function ambilFoto(){
  const video=document.getElementById("video");
  const canvas=document.getElementById("canvas");
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  const ctx=canvas.getContext("2d");
  ctx.drawImage(video,0,0);
  return new Promise(resolve=>{
    canvas.toBlob(blob=>{
      resolve(blob);
    },"image/jpeg",0.9);
  });
}

/* ================= PROSES ABSENSI ================= */
async function prosesAbsensi(status){

  const petugas_id=document.getElementById("petugas").value;
  const message=document.getElementById("message");

  if(!petugas_id){
    alert("Pilih nama terlebih dahulu");
    return;
  }

  message.style.display="block";
  message.className="status-box";
  message.innerText="Validasi lokasi...";

  if(!navigator.geolocation){
    message.className="status-box error";
    message.innerText="GPS tidak didukung.";
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos=>{

    const lat=pos.coords.latitude;
    const lng=pos.coords.longitude;

    const jarak=hitungJarak(lat,lng,TARGET_LAT,TARGET_LNG);

    if(jarak>RADIUS_METERS){
      message.className="status-box error";
      message.innerText="Anda di luar area POS 9!";
      return;
    }

    message.innerText="Mengambil foto...";

    const foto=await ambilFoto();

    const formData=new FormData();
    formData.append("petugas_id",petugas_id);
    formData.append("status",status);
    formData.append("foto",foto);

    message.innerText="Mengirim absensi...";

    const res=await fetch(API+"/absensi",{
      method:"POST",
      body:formData
    });

    const data=await res.json();

    if(res.ok){
      message.className="status-box success";
      message.innerText="Absensi berhasil!";
    }else{
      message.className="status-box error";
      message.innerText=data.error||"Gagal absen.";
    }

  },err=>{
    message.className="status-box error";
    message.innerText="GPS harus aktif!";
  });
}

/* ================= INIT ================= */
tampilkanTanggal();
loadPetugas();
startCamera();
</script>

</body>
</html>
