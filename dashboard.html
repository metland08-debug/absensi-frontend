<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin - Absensi Linmas</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f9;
}

/* LOGIN */
.login-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(135deg, #1e3c72, #2a5298);
}

.card {
  background: white;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  width: 100%;
  max-width: 400px;
}

h2 {
  text-align: center;
  color: #2a5298;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 14px;
}

button {
  background: #2a5298;
  color: white;
  border: none;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1e3c72;
}

.error {
  color: red;
  text-align: center;
  margin-top: 10px;
}

/* DASHBOARD */
.dashboard {
  display: none;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.action-buttons {
  display: flex;
  gap: 10px;
}

.logout-btn {
  background: red;
  padding: 8px 12px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  border: none;
}

.export-btn {
  background: green;
  padding: 8px 12px;
  border-radius: 6px;
  color: white;
  cursor: pointer;
  border: none;
}

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background: white;
}

th, td {
  padding: 10px;
  text-align: center;
  border-bottom: 1px solid #ddd;
}

th {
  background: #2a5298;
  color: white;
}

.status-lengkap { color: green; font-weight: bold; }
.status-masuk { color: orange; font-weight: bold; }
.status-belum { color: red; font-weight: bold; }
.status-libur { color: gray; font-weight: bold; }

</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-container" id="loginBox">
  <div class="card">
    <h2>Login Admin</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <div class="error" id="error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboardBox">
  <div class="header">
    <h2>Dashboard Absensi Hari Ini</h2>
    <div class="action-buttons">
      <button class="export-btn" onclick="exportExcel()">Download Excel</button>
      <button class="logout-btn" onclick="logout()">Logout</button>
    </div>
  </div>

  <table id="tabel">
    <thead>
      <tr>
        <th>Nama</th>
        <th>Shift</th>
        <th>Masuk</th>
        <th>Pulang</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API = "https://absensi-backend-sc11.onrender.com";
const ADMIN_USER = "admin";
const ADMIN_PASS = "linmas2026";

/* ================= LOGIN ================= */
function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();

  if (u === ADMIN_USER && p === ADMIN_PASS) {
    sessionStorage.setItem("isAdmin", "true");
    showDashboard();
  } else {
    document.getElementById("error").innerText = "Username atau password salah";
  }
}

function logout() {
  sessionStorage.removeItem("isAdmin");
  location.reload();
}

function showDashboard() {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboardBox").style.display = "block";
  loadDashboard();
}

if (sessionStorage.getItem("isAdmin") === "true") {
  showDashboard();
}

/* ================= LOGIKA DASHBOARD ================= */

function getGlobalIndex() {
  const startDate = new Date("2026-01-26");
  const now = new Date();
  const today = new Date(now);
  today.setHours(0,0,0,0);

  const diffTime = today.getTime() - startDate.getTime();
  const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

  return ((diffDays % 5) + 5) % 5;
}

function getTodayTanggal() {
  const now = new Date();
  const jam = now.getHours() + now.getMinutes()/60;

  if (jam < 8) {
    now.setDate(now.getDate() - 1);
  }

  return now.toISOString().split("T")[0];
}

async function loadDashboard() {
  const petugasRes = await fetch(API + "/petugas");
  const absensiRes = await fetch(API + "/absensi");

  const petugas = await petugasRes.json();
  const absensi = await absensiRes.json();

  const globalIndex = getGlobalIndex();
  const today = getTodayTanggal();

  const shiftList = ["Pagi 1","Pagi 2","Malam 1","Malam 2","LIBUR"];

  const tbody = document.querySelector("#tabel tbody");
  tbody.innerHTML = "";

  petugas.forEach(p => {

    const offset = p.siklus_offset || 0;
    const petugasIndex = (globalIndex + offset) % 5;
    const shift = shiftList[petugasIndex];

    const absenHariIni = absensi.filter(a =>
      a.nama === p.nama && a.tanggal === today
    );

    let masuk = "-";
    let pulang = "-";
    let statusText = "";
    let statusClass = "";

    if (petugasIndex === 4) {
      statusText = "LIBUR";
      statusClass = "status-libur";
    } else {
      absenHariIni.forEach(a => {
        if (a.status === "MASUK") masuk = a.jam;
        if (a.status === "PULANG") pulang = a.jam;
      });

      if (masuk !== "-" && pulang !== "-") {
        statusText = "Lengkap";
        statusClass = "status-lengkap";
      } else if (masuk !== "-" && pulang === "-") {
        statusText = "Sudah Masuk";
        statusClass = "status-masuk";
      } else {
        statusText = "Belum Absen";
        statusClass = "status-belum";
      }
    }

    tbody.innerHTML += `
      <tr>
        <td>${p.nama}</td>
        <td>${shift}</td>
        <td>${masuk}</td>
        <td>${pulang}</td>
        <td class="${statusClass}">${statusText}</td>
      </tr>
    `;
  });
}

/* ================= EXPORT EXCEL ================= */

function exportExcel() {
  const table = document.getElementById("tabel");
  let csv = [];

  for (let i = 0; i < table.rows.length; i++) {
    let row = [], cols = table.rows[i].cells;
    for (let j = 0; j < cols.length; j++) {
      row.push(cols[j].innerText);
    }
    csv.push(row.join(","));
  }

  const blob = new Blob([csv.join("\n")], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "rekap_absensi_hari_ini.csv";
  link.click();
}

setInterval(loadDashboard, 30000);
</script>

</body>
</html>
